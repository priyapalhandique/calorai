name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping calorai health endpoint
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
        run: |
          if [ -z "$LIVE_URL" ]; then
            echo "Set the LIVE_URL repository variable (e.g. https://calorai.onrender.com) to enable the keep-alive."
            exit 0
          fi
          curl -sf --max-time 30 "$LIVE_URL/api/health" > /dev/null \
            && echo "health OK" \
            || echo "health check failed (render free tier may be waking up)"